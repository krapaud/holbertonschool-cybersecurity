# ============================================================================
# Nexus Financial hardening configuration
# ============================================================================
# This file contains configuration values only. Do not store passwords,
# private keys or other secrets here.

# ----------------------------------------------------------------------------
# File locations
# ----------------------------------------------------------------------------
SSHD_CONFIG_FILE="/etc/ssh/sshd_config"
SSHD_DROPIN="/etc/ssh/sshd_config.d/99-nexus-hardening.conf"
SYSCTL_DROPIN="/etc/sysctl.d/99-nexus-hardening.conf"
UMASK_DROPIN="/etc/profile.d/99-nexus-umask.sh"
BACKUP_ROOT="/var/backups"
LOG_FILE="/var/log/nexus-hardening.log"

# ----------------------------------------------------------------------------
# Service and account checks
# ----------------------------------------------------------------------------
SSH_SERVICES="ssh sshd"
KEY_SEARCH_PATHS="/root /home"

# ----------------------------------------------------------------------------
# SSH baseline
# ----------------------------------------------------------------------------
SSH_PUBKEY_AUTHENTICATION="yes"
SSH_PASSWORD_AUTHENTICATION="no"
SSH_PERMIT_ROOT_LOGIN="no"
SSH_PERMIT_EMPTY_PASSWORDS="no"
SSH_X11_FORWARDING="no"

# ----------------------------------------------------------------------------
# Kernel and network baseline
# ----------------------------------------------------------------------------
KERNEL_RANDOMIZE_VA_SPACE="2"
IPV4_ALL_ACCEPT_REDIRECTS="0"
IPV4_DEFAULT_ACCEPT_REDIRECTS="0"
IPV4_ALL_ACCEPT_SOURCE_ROUTE="0"
IPV4_DEFAULT_ACCEPT_SOURCE_ROUTE="0"
IPV4_ALL_SEND_REDIRECTS="0"
IPV4_DEFAULT_SEND_REDIRECTS="0"
IPV4_ALL_RP_FILTER="1"
IPV4_ICMP_ECHO_IGNORE_BROADCASTS="1"

# ----------------------------------------------------------------------------
# Local file permission baseline
# ----------------------------------------------------------------------------
DEFAULT_UMASK="027"
SSH_DIRECTORY_MODE="0700"
AUTHORIZED_KEYS_MODE="0600"
SYSTEM_CONFIG_MODE="0644"
LOG_MODE="0600"
