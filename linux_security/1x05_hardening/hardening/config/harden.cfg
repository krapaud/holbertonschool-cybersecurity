# SSH configuration
SSH_PORT=22
ALLOWED_SSH_USERS=("root")

# Allowed network ports
ALLOW_HTTP=80
ALLOW_HTTPS=443

# Password policy
PASS_MAX_DAYS=90
PASS_MIN_LEN=12

# Password complexity (negative value = minimum required)
PASS_UCREDIT=-1
PASS_LCREDIT=-1
PASS_DCREDIT=-1
PASS_OCREDIT=-1

# Account lockout policy
FAIL_LOCK_ATTEMPTS=5

# Insecure tools to remove (H-02)
REMOVE_TOOLS=("telnet" "ftp" "netcat-traditional")

# Security tools to install (H-03)
INSTALL_TOOLS=("auditd" "fail2ban")
